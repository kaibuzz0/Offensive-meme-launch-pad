name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and static assets
        run: |
          node scripts/build-share-pages.mjs
          node scripts/check.mjs
          node --test scripts/*.test.mjs
      - name: Assemble public files
        run: |
          mkdir _site
          cp index.html styles.css app.js tokens.js launchpad-config.js trade-core.js trade.js share-core.js social.js pwa.js sw.js manifest.webmanifest offline.html .nojekyll _site/
          cp -r assets tokens _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
